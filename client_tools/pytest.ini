[tool:pytest]
testpaths = selenium_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    --html=selenium_tests/test_report.html
    --self-contained-html
    --cache-dir=selenium_tests/.pytest_cache
    -v
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests