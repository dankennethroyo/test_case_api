# NGINX Configuration for Test Case API
# This configuration proxies requests to Flask backend running on localhost

upstream flask_backend {
    server 127.0.0.1:5009;  # Flask app on localhost only (Ubuntu OS access only)
    keepalive 32;
}

server {
    listen 8080;              # NGINX listens on all interfaces (0.0.0.0:8080)
    server_name _;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Client body size (10MB for file uploads)
    client_max_body_size 10M;
    
    # Logging
    access_log /var/log/nginx/test-case-api-access.log;
    error_log /var/log/nginx/test-case-api-error.log warn;
    
    # Main proxy location
    location / {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts for long-running requests (AI generation can take time)
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Server-Sent Events (SSE) support for streaming endpoint
    location /generate/stream {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        
        # SSE requires these settings
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Disable buffering for streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        
        # Long timeout for streaming
        proxy_read_timeout 600s;
        proxy_connect_timeout 75s;
    }
    
    # Health check endpoint optimization
    location /health {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;  # Don't log health checks
    }
    
    # Static files (if needed in future)
    # location /static/ {
    #     alias /opt/test_case_api/static/;
    #     expires 1d;
    #     add_header Cache-Control "public, immutable";
    # }
}
